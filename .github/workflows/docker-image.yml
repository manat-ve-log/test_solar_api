name: Deploy API to EC2

on:
  push:
  branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up SSH Key
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ EC2_HOST.EC2_SSH_KEY }}

    - name: Add EC2 to known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ EC2_HOST.EC2_HOST }} >> ~/.ssh/known_hosts

    - name: Copy project files to EC2
      run: |
        rsync -avz --exclude '.git' --exclude 'node_modules' ./ ${{ EC2_HOST.EC2_USER }}@${{ EC2_HOST.EC2_HOST }}:/var/www/my-api/

    - name: Deploy and Restart Application on EC2
      run: |
        ssh ${{ EC2_HOST.EC2_USER }}@${{ EC2_HOST.EC2_HOST }} << 'EOF'
          cd /var/www/my-api
          
          # Pull latest changes or ensure environment variables are linked
          # If using Docker Compose:
          docker compose down
          docker compose up --build -d
          
          # Optional: Clean up old Docker images to save disk space
          docker image prune -f
        EOF