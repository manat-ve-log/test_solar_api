name: Deploy SolarEdge API to EC2

on:
  push:
    branches:
      - deployment
    paths:
      - 'solaredge-api/**'
      - '.github/workflows/deploy-solaredge.yml'

permissions:
  contents: read

concurrency:
  group: deploy-solaredge-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 to known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare EC2
        run: |
          ssh -o BatchMode=yes \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "mkdir -p /var/www/solaredge-api"

      - name: Copy SolarEdge API files
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.*' \
            ./solaredge-api/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/solaredge-api/

      - name: Deploy SolarEdge API
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -Eeuo pipefail

            cd /var/www/solaredge-api

            docker compose -p solaredge-api config -q

            docker compose -p solaredge-api up \
              --build \
              -d \
              --remove-orphans

            docker compose -p solaredge-api ps

            echo "SolarEdge API deployment completed!"
          EOF